<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>天枢</title>
<style>
  :root{color-scheme:dark;
    --bg:#0a0a0d;--s1:#131318;--s2:#1b1b22;--s3:#23232c;--bd:rgba(255,255,255,.065);
    --gold:#d9b45e;--gold-l:#e6c374;--gold-d:#cfa64e;--tx:#f2f1ec;--tx2:#a8a49a;--dim:#6f6b63;--user:#1e1a12}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%,rgba(217,180,94,.05),transparent 60%),var(--bg);
       color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
       display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(217,180,94,.25)}
  header{flex:none;position:sticky;top:0;z-index:5;background:rgba(10,10,13,.82);backdrop-filter:blur(14px) saturate(1.2);
         border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
  .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;height:54px;padding:0 22px}
  h1{font-size:17px;font-weight:600;letter-spacing:.24em;color:var(--gold)}
  nav{display:flex;gap:2px;background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:3px}
  nav a{color:var(--dim);text-decoration:none;font-size:12.5px;padding:4px 13px;border-radius:10px;transition:.15s}
  nav a.on{color:var(--tx);background:var(--s3)}
  header .sub{margin-left:auto;font-size:11.5px;color:var(--dim)}

  #chat{flex:1;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:16px;
        max-width:1080px;width:100%;margin:0 auto}
  #chat::-webkit-scrollbar{width:10px}
  #chat::-webkit-scrollbar-thumb{background:#26262f;border-radius:8px;border:2px solid var(--bg)}
  .row{display:flex;flex-direction:column;max-width:min(86%,720px)}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.ai{align-self:flex-start;align-items:flex-start}
  .bubble{padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7}
  .me .bubble{background:var(--user);border:1px solid rgba(217,180,94,.16);border-bottom-right-radius:5px}
  .ai .bubble{background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:5px}
  .ai .bubble a{color:var(--gold)}
  .ai .bubble strong{color:var(--gold);font-weight:600}
  .meta{font-size:11px;color:var(--dim);margin-top:5px;padding:0 4px}
  .pend{color:var(--dim);font-style:italic}
  .err{color:#e07a68;border-color:rgba(224,122,104,.3)}

  footer{flex:none;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
         border-top:1px solid var(--bd);background:rgba(10,10,13,.9);backdrop-filter:blur(10px)}
  .ft{max-width:1080px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  #inp{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:18px;color:var(--tx);
       padding:12px 16px;font-size:16px;line-height:1.5;outline:none;resize:none;max-height:132px;transition:border-color .15s}
  #inp:focus{border-color:rgba(217,180,94,.32)}
  #send{flex:none;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));color:#221a06;border:0;
        border-radius:18px;height:44px;padding:0 22px;font-size:14px;font-weight:600;transition:.15s}
  #send:hover{filter:brightness(1.06)}
  #send:disabled{opacity:.45}
  @media (max-width:720px){
    .bar{padding:0 16px;height:50px}
    #chat{padding:16px 14px 6px}
    footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  }
</style></head><body>
<header><div class="bar"><h1>天枢</h1><nav><a href="index.html" class="on">对话</a><a id="nb" href="board.html">看板</a></nav><div class="sub" id="st">连接中…</div></div></header>
<div id="chat"></div>
<footer><div class="ft"><textarea id="inp" rows="1" placeholder="说事、记账、提问，都行…"></textarea><button id="send">发送</button></div></footer>
<script>
var API = 'https://cmswoyiuoeqzeassubvw.supabase.co/functions/v1/tianshu-app';
var K = new URLSearchParams(location.search).get('k') || '';
try { if (K) localStorage.setItem('ts_k', K); else K = localStorage.getItem('ts_k') || ''; } catch(e){}
var chat = document.getElementById('chat'), st = document.getElementById('st');
var inp = document.getElementById('inp'), btn = document.getElementById('send');
var lastSig = '';
document.getElementById('nb').href='board.html'+(K?'?k='+encodeURIComponent(K):'');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  var h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank">$1<\/a>');
  return h;
}
function fmtTime(iso){
  var d = new Date(iso);
  return (d.getMonth()+1)+'-'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
var SRC = {iphone:'🎙️', iphone_test:'🎙️', web:'💬', a1:'📀', a1_test:'📀', manual:'✍️'};

function render(rows){
  var sig = JSON.stringify(rows.map(function(r){return [r.id, r.status, (r.reply||'').length];}));
  if (sig === lastSig) return;
  lastSig = sig;
  var nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  var html = '';
  rows.forEach(function(r){
    html += '<div class="row me"><div class="bubble">' + esc(r.content) + '</div>'
          + '<div class="meta">' + (SRC[r.source]||'📎') + ' ' + fmtTime(r.created_at) + '</div></div>';
    if (r.status === 'new' || r.status === 'processing') {
      html += '<div class="row ai"><div class="bubble pend">⏳ 处理中…</div></div>';
    } else {
      var body = r.reply || r.result || '(已处理)';
      var cls = r.status === 'error' ? 'bubble err' : 'bubble';
      html += '<div class="row ai"><div class="' + cls + '">' + md(body) + '</div>'
            + '<div class="meta">天枢 · ' + (r.status==='error'?'需要你确认':'已办') + '</div></div>';
    }
  });
  chat.innerHTML = html;
  if (nearBottom || !chat.dataset.init) { chat.scrollTop = chat.scrollHeight; chat.dataset.init = '1'; }
}

function load(){
  fetch(API + '?feed=1&k=' + encodeURIComponent(K))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(rows){ st.textContent = '在线 · ' + rows.length + ' 条'; render(rows); })
    .catch(function(){ st.textContent = '连不上,检查链接里的 k'; });
}

btn.onclick = function(){
  var t = inp.value.trim();
  if (!t) return;
  btn.disabled = true;
  fetch(API + '?send=1&k=' + encodeURIComponent(K), {method:'POST', body:t})
    .then(function(){ inp.value=''; lastSig=''; load(); })
    .finally(function(){ btn.disabled = false; inp.focus(); });
};
inp.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btn.onclick(); }
});
load();
setInterval(load, 8000);
</script></body></html>
