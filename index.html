<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>天枢</title>
<style>
  :root{--bg:#0a0a0d;--card:#16151a;--gold:#d8b25c;--txt:#e8e6e1;--dim:#8a8578;--line:rgba(216,178,92,.18);--user:#2a2416}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,"PingFang SC",sans-serif;
       display:flex;flex-direction:column;height:100dvh}
  header{padding:14px 18px 10px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:10px;flex:none;padding-top:calc(14px + env(safe-area-inset-top))}
  header h1{font-size:19px;font-weight:600;background:linear-gradient(120deg,#f0d99a,#d8b25c,#f0d99a);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{font-size:12px;color:var(--dim)}
  #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-direction:column;max-width:86%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.ai{align-self:flex-start;align-items:flex-start}
  .bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
  .me .bubble{background:var(--user);border:1px solid var(--line);border-bottom-right-radius:4px}
  .ai .bubble{background:var(--card);border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:4px}
  .ai .bubble a{color:var(--gold)}
  .ai .bubble strong{color:var(--gold);font-weight:600}
  .meta{font-size:11px;color:var(--dim);margin-top:4px;padding:0 4px}
  .pend{color:var(--dim);font-style:italic}
  .err{color:#c96a5a}
  footer{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}
  #inp{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;
       color:var(--txt);padding:10px 16px;font-size:16px;outline:none;resize:none;max-height:120px}
  #send{flex:none;background:linear-gradient(135deg,#e8ca7d,#c9a24a);color:#241d0d;border:0;
        border-radius:20px;padding:0 20px;font-size:15px;font-weight:600}
  #send:disabled{opacity:.45}
</style></head><body>
<header><h1>天 枢</h1><nav style="display:flex;gap:4px"><a href="index.html" style="color:#241d0d;background:#d8b25c;font-weight:600;text-decoration:none;font-size:14px;padding:3px 12px;border-radius:14px">对话</a><a id="nb" href="board.html" style="color:#8a8578;text-decoration:none;font-size:14px;padding:3px 12px;border-radius:14px">看板</a></nav><div class="sub" id="st">连接中…</div></header>
<div id="chat"></div>
<footer>
  <textarea id="inp" rows="1" placeholder="说事、记账、提问,都行…"></textarea>
  <button id="send">发送</button>
</footer>
<script>
var API = 'https://cmswoyiuoeqzeassubvw.supabase.co/functions/v1/tianshu-app';
var K = new URLSearchParams(location.search).get('k') || '';
try { if (K) localStorage.setItem('ts_k', K); else K = localStorage.getItem('ts_k') || ''; } catch(e){}
var chat = document.getElementById('chat'), st = document.getElementById('st');
var inp = document.getElementById('inp'), btn = document.getElementById('send');
var lastSig = '';
document.getElementById('nb').href='board.html'+(K?'?k='+encodeURIComponent(K):'');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  var h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank">$1<\/a>');
  return h;
}
function fmtTime(iso){
  var d = new Date(iso);
  return (d.getMonth()+1)+'-'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
var SRC = {iphone:'🎙️', iphone_test:'🎙️', web:'💬', a1:'📀', a1_test:'📀', manual:'✍️'};

function render(rows){
  var sig = JSON.stringify(rows.map(function(r){return [r.id, r.status, (r.reply||'').length];}));
  if (sig === lastSig) return;
  lastSig = sig;
  var nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  var html = '';
  rows.forEach(function(r){
    html += '<div class="row me"><div class="bubble">' + esc(r.content) + '</div>'
          + '<div class="meta">' + (SRC[r.source]||'📎') + ' ' + fmtTime(r.created_at) + '</div></div>';
    if (r.status === 'new' || r.status === 'processing') {
      html += '<div class="row ai"><div class="bubble pend">⏳ 处理中…</div></div>';
    } else {
      var body = r.reply || r.result || '(已处理)';
      var cls = r.status === 'error' ? 'bubble err' : 'bubble';
      html += '<div class="row ai"><div class="' + cls + '">' + md(body) + '</div>'
            + '<div class="meta">天枢 · ' + (r.status==='error'?'需要你确认':'已办') + '</div></div>';
    }
  });
  chat.innerHTML = html;
  if (nearBottom || !chat.dataset.init) { chat.scrollTop = chat.scrollHeight; chat.dataset.init = '1'; }
}

function load(){
  fetch(API + '?feed=1&k=' + encodeURIComponent(K))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(rows){ st.textContent = '在线 · ' + rows.length + ' 条'; render(rows); })
    .catch(function(){ st.textContent = '连不上,检查链接里的 k'; });
}

btn.onclick = function(){
  var t = inp.value.trim();
  if (!t) return;
  btn.disabled = true;
  fetch(API + '?send=1&k=' + encodeURIComponent(K), {method:'POST', body:t})
    .then(function(){ inp.value=''; lastSig=''; load(); })
    .finally(function(){ btn.disabled = false; inp.focus(); });
};
inp.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btn.onclick(); }
});
load();
setInterval(load, 8000);
</script></body></html>
