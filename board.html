<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>天枢 · 看板</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0a0d;--s1:#131318;--s2:#1b1b22;--s3:#23232c;
    --bd:rgba(255,255,255,.065);--gold:#d9b45e;--gold-d:#cfa64e;--gold-l:#e6c374;
    --tx:#f2f1ec;--tx2:#a8a49a;--dim:#6f6b63;
    --red:#e07a68;--amber:#d9a64a;--green:#7cb68a;--blue:#7fa6d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:
        radial-gradient(1200px 600px at 50% -10%,rgba(217,180,94,.05),transparent 60%),
        var(--bg);
       color:var(--tx);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
       min-height:100dvh;padding-bottom:calc(56px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(217,180,94,.25)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#26262f;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#33333e}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:5;background:rgba(10,10,13,.82);backdrop-filter:blur(14px) saturate(1.2);
         border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
  .bar{display:flex;align-items:center;gap:18px;height:54px}
  h1{font-size:17px;font-weight:600;letter-spacing:.24em;color:var(--gold);padding-left:2px}
  nav{display:flex;gap:2px;background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:3px}
  nav a{color:var(--dim);text-decoration:none;font-size:12.5px;padding:4px 13px;border-radius:10px;transition:.15s}
  nav a:hover{color:var(--tx2)}
  nav a.on{color:var(--tx);background:var(--s3)}
  .sum{margin-left:auto;display:flex;gap:6px;align-items:center}
  .st{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--dim)}
  .st b{color:var(--tx2);font-weight:600;margin-left:1px}
  .st i{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.85}
  .st i.a{background:var(--amber)} .st i.r{background:var(--red)} .st i.b{background:var(--blue)}

  .say{margin:20px 0 8px;background:linear-gradient(180deg,#15151b,#111116);border:1px solid var(--bd);border-radius:20px;
       padding:13px 15px 11px;box-shadow:0 10px 34px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .2s}
  .say:focus-within{border-color:rgba(217,180,94,.32);box-shadow:0 10px 34px rgba(0,0,0,.45),0 0 0 3px rgba(217,180,94,.05)}
  .say textarea{width:100%;overflow-y:auto;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;
                line-height:1.6;resize:none;min-height:26px;max-height:34dvh;display:block;padding:2px}
  .say textarea::placeholder{color:var(--dim)}
  .say .bt{display:flex;align-items:center;gap:6px;margin-top:10px}
  .tool{width:32px;height:32px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);color:var(--tx2);font-size:14px;
        display:flex;align-items:center;justify-content:center;padding:0;transition:.15s}
  .tool:hover{background:var(--s3);color:var(--tx)}
  .say .hint{flex:1;min-width:0;font-size:11.5px;color:var(--dim);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{background:transparent;color:var(--tx2);border:1px solid var(--bd);border-radius:11px;height:32px;padding:0 15px;font-size:13px;transition:.15s}
  .go:hover{color:var(--tx);border-color:#3a3a46;background:var(--s2)}
  .mic{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));color:#221a06;
       border:0;border-radius:11px;height:32px;padding:0 15px;font-size:13px;font-weight:600;
       box-shadow:0 2px 12px rgba(207,166,78,.2);transition:.15s}
  .mic:hover{filter:brightness(1.06)}
  .mic svg{width:15px;height:15px}
  .mic.on{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.72}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
  .chip img{width:100%;height:100%;object-fit:cover;display:block}
  .chip b{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;
          font-size:13px;line-height:20px;text-align:center;font-weight:400;cursor:pointer}

  .fb{margin:0 0 26px;display:flex;flex-direction:column;gap:8px}
  .fb div{font-size:12.5px;color:var(--tx2);background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:10px 14px;line-height:1.6}
  .fb b{font-weight:600;color:var(--tx)}
  .fb .to{color:var(--gold);margin-top:3px}
  .fb .wait{color:var(--dim);margin-top:3px}

  .h{display:flex;align-items:baseline;gap:9px;font-size:12px;letter-spacing:.05em;color:var(--tx2);margin:0 0 11px;font-weight:600}
  .h:before{content:"";width:3px;height:11px;border-radius:2px;background:var(--gold);opacity:.8;align-self:center;margin-right:-2px}
  .h em{font-style:normal;color:var(--dim);letter-spacing:0;font-size:11.5px;font-weight:400}

  .now{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-bottom:30px}
  .list{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
  .li{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;cursor:pointer;border-top:1px solid var(--bd);transition:background .15s}
  .li:first-child{border-top:0}
  .li:hover{background:var(--s2)}
  .li .n{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(217,180,94,.13);color:var(--gold);
         font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .li .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--amber);margin:9px 3px 0 3px}
  .li .t{font-size:14.5px;font-weight:600;color:var(--tx);line-height:1.45}
  .li .s{font-size:12.5px;color:var(--tx2);margin-top:2px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .none{padding:18px 16px;color:var(--dim);font-size:12.5px}

  .tds{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:34px}
  .td{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--bd);transition:background .15s}
  .td:hover{background:var(--s2)}
  .td:first-child{border-top:0}
  .td .ck{flex:none;width:21px;height:21px;border-radius:50%;border:1.5px solid #3a3a46;background:none;display:flex;align-items:center;
          justify-content:center;color:transparent;font-size:12px;padding:0;transition:.15s}
  .td .ck:hover{border-color:var(--green);color:rgba(124,182,138,.5)}
  .td.dn .ck{background:var(--green);border-color:var(--green);color:#0b0b0e}
  .td .tt{flex:1;min-width:0;font-size:14.5px}
  .td.dn .tt{color:var(--dim);text-decoration:line-through}
  .td .du{flex:none;font-size:11.5px;color:var(--dim)}
  .td .du.late{color:var(--red)} .td .du.today{color:var(--amber)}
  .td .rm{flex:none;background:none;border:0;color:var(--dim);font-size:17px;line-height:1;padding:2px 4px;opacity:0;transition:.15s}
  .td:hover .rm{opacity:.6}
  .td .rm:hover{opacity:1;color:var(--red)}

  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:26px 20px;align-items:start}
  .col>h2{font-size:12px;font-weight:600;color:var(--tx2);margin:0 0 11px;display:flex;gap:8px;align-items:center;cursor:pointer;letter-spacing:.04em}
  .col>h2 span{color:var(--dim);font-weight:500;font-size:11px;background:var(--s1);border:1px solid var(--bd);border-radius:999px;padding:1px 7px}
  .col.shut .cards{display:none}
  .cards{display:flex;flex-direction:column;gap:8px}
  .c{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;cursor:pointer;
     transition:transform .16s ease,background .16s,border-color .16s,box-shadow .16s}
  .c:hover{background:var(--s2);border-color:rgba(217,180,94,.2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.28)}
  .c.drag{opacity:.35}
  .c.over{border-color:var(--gold);background:var(--s2)}
  .c .nm{font-size:14.5px;font-weight:600;line-height:1.45;color:var(--tx)}
  .c .wh{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c .ft{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;color:var(--dim)}
  .c .ft i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
  .c .ft i.m{background:var(--amber)} .c .ft i.o,.c .ft i.k{background:var(--red)} .c .ft i.d{background:var(--blue)} .c .ft i.x{background:#3a3a46}
  .c .ft .w{color:var(--red)} .c .ft .m{color:var(--amber)}
  .empty{color:var(--dim);font-size:12.5px;padding:6px 2px}
  .fold{margin-top:34px}
  .fold summary{color:var(--dim);font-size:12.5px;cursor:pointer;margin-bottom:14px;user-select:none}
  .fold summary:hover{color:var(--tx2)}
  .fold .cols{opacity:.72}
  .fold .cols:hover{opacity:1;transition:opacity .2s}

  #ov{position:fixed;inset:0;background:rgba(5,5,7,.62);backdrop-filter:blur(4px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  #ov.on{display:flex}
  #sheet{background:linear-gradient(180deg,#17171d,#111116);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;
         max-width:600px;max-height:86dvh;overflow-y:auto;padding:24px 26px calc(22px + env(safe-area-inset-bottom));
         box-shadow:0 34px 90px rgba(0,0,0,.65);animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
  .sh-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:2px}
  .sh-top h3{flex:1;font-size:19px;font-weight:600;line-height:1.35}
  .x{background:var(--s2);border:1px solid var(--bd);border-radius:10px;color:var(--tx2);font-size:18px;line-height:1;
     width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
  .x:hover{color:var(--tx);background:var(--s3)}
  .stl{font-size:12px;color:var(--dim);margin:8px 0 18px}
  .stl b{font-weight:600;color:var(--tx2)}
  .blk{margin-bottom:16px}
  .blk .k{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-bottom:4px}
  .blk .v{font-size:14px;line-height:1.68;color:var(--tx)}
  .blk.nx .v{color:var(--gold)}
  .advbox{background:linear-gradient(180deg,rgba(217,180,94,.10),rgba(217,180,94,.035));border:1px solid rgba(217,180,94,.26);
          border-radius:14px;padding:13px 15px;margin-bottom:16px}
  .advbox .k{font-size:11px;color:var(--gold);letter-spacing:.05em;margin-bottom:5px}
  .advbox .v{font-size:14px;line-height:1.66;color:#f4ead0}
  .askbox{background:rgba(224,122,104,.09);border:1px solid rgba(224,122,104,.28);border-radius:14px;padding:13px 15px;margin-bottom:16px}
  .askbox .k{font-size:11px;color:var(--red);letter-spacing:.05em;margin-bottom:5px}
  .askbox .v{font-size:14px;line-height:1.65;margin-bottom:11px}
  .tl{border-left:1px solid var(--bd);margin:6px 0 0 5px;padding-left:17px}
  .tl div{position:relative;font-size:13px;color:var(--tx2);padding:0 0 13px;line-height:1.58}
  .tl div:before{content:"";position:absolute;left:-21px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--s3);border:1px solid #3a3a46}
  .tl div.last{color:var(--tx)}
  .tl div.last:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,180,94,.12)}
  .tl small{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .tl div.me{color:var(--blue)}
  .rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .rel a{background:var(--s2);border:1px solid rgba(217,180,94,.22);color:var(--gold);border-radius:10px;padding:4px 10px;font-size:12.5px;text-decoration:none;cursor:pointer;transition:.15s}
  .rel a:hover{background:var(--s3)}
  .rel select{appearance:none;-webkit-appearance:none;background:var(--s2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236f6b63'/></svg>") no-repeat right 8px center;
            color:var(--tx2);border:1px solid var(--bd);border-radius:10px;padding:5px 24px 5px 10px;font-size:12.5px;max-width:170px;cursor:pointer}
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--bd)}
  .acts button{background:var(--s2);color:var(--tx2);border:1px solid var(--bd);border-radius:10px;padding:8px 13px;font-size:12.5px;transition:.15s}
  .acts button:hover{color:var(--tx);background:var(--s3);border-color:#3a3a46}
  .acts button.p{background:linear-gradient(180deg,var(--gold-l),var(--gold-d));border-color:transparent;color:#221a06;font-weight:600}
  .acts .sp{flex:1}
  .nt{display:flex;gap:8px}
  .nt input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:11px;color:var(--tx);padding:10px 13px;font-size:16px;outline:none;transition:.15s}
  .nt input:focus{border-color:rgba(217,180,94,.32)}
  .nt button{background:var(--s2);color:var(--gold);border:1px solid rgba(217,180,94,.26);border-radius:11px;padding:0 16px;font-size:12.5px}
  .nt button:hover{background:var(--s3)}
  .noted{font-size:12.5px;color:var(--blue);margin-bottom:10px;background:rgba(127,166,212,.08);border:1px solid rgba(127,166,212,.2);border-radius:11px;padding:9px 12px}
  .noted a{color:var(--dim);margin-left:8px}

  #toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);
         background:#1d1d24;border:1px solid rgba(217,180,94,.28);color:var(--gold);padding:9px 18px;border-radius:13px;
         font-size:12.5px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    .wrap{padding:0 16px}
    .sum{display:none}
    .now{grid-template-columns:1fr;gap:22px}
    .bar{height:50px;gap:12px}
    h1{font-size:16px}
    #ov{align-items:flex-end;padding:0}
    #sheet{max-width:none;max-height:92dvh;border-radius:20px 20px 0 0;border-bottom:0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
    .say textarea{font-size:16px}
  }

</style></head><body>
<header><div class="wrap"><div class="bar">
  <h1>天枢</h1>
  <nav><a href="index.html" id="n1">对话</a><a href="board.html" class="on">看板</a></nav>
  <div class="sum" id="sum"></div>
</div></div></header>

<div class="wrap">
  <div class="say">
    <textarea id="say" rows="1" placeholder="想到什么就说：任务进展、待办、点子、记账、提问都行，我来分"></textarea>
    <div class="chips" id="chips"></div>
    <div class="bt">
      <button class="tool" id="pic" title="发图片">🖼</button>
      <button class="tool" id="lnk" title="粘贴链接">🔗</button>
      <span class="hint" id="hint">中英混着说，或点右边话筒直接说</span>
      <button class="go" id="go">发送</button>
      <button class="mic" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="miclb">语音</span></button>
    </div>
    <input type="file" id="file" accept="image/*" multiple style="display:none">
  </div>
  <div class="fb" id="fb"></div>
  <div id="m"><div class="empty">加载中…</div></div>
</div>
<div id="ov"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>

<script>
var API='https://cmswoyiuoeqzeassubvw.supabase.co/functions/v1/tianshu-app';
var K=new URLSearchParams(location.search).get('k')||'';
try{ if(K) localStorage.setItem('ts_k',K); else K=localStorage.getItem('ts_k')||''; }catch(e){}
document.getElementById('n1').href='index.html'+(K?'?k='+encodeURIComponent(K):'');
var GRPS=['台球AI','3D建模','视频内容','直播与公司','其他','点子池'];
var DATA={projects:[],log:[],todos:[],inbox:[]}, shut={}, sig='', cur=null;
var ST={cancelled:'已取消',active:'进行中',blocked:'卡住',stalled:'停滞',idea:'点子',paused:'已暂停',done:'已完成'};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function days(iso){return Math.floor((Date.now()-new Date(iso).getTime())/864e5);}
function ago(n){return n<=0?'今天':n+'天前';}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on');},1600);}
function fmt(iso){var d=new Date(iso);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function byId(id){return DATA.projects.find(function(x){return x.id===id;});}
function call(body){return fetch(API+'?act=1&k='+encodeURIComponent(K),{method:'POST',body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw 0;return r.json();});}
function act(id,action,text,msg){call({id:id,action:action,text:text||''}).then(function(){toast(msg||'已记下');closeSheet();load(true);}).catch(function(){toast('没成功，再试一下');});}

function dotCls(p){
  if(p.blocked_on_nange) return 'k';
  if(p.status==='idea') return 'd';
  if(p.status==='done'||p.status==='paused'||p.status==='cancelled') return 'x';
  var n=days(p.last_touched); return n>=10?'o':n>=5?'m':'';
}
function foot(p){
  var n=days(p.last_touched), t='';
  if(p.blocked_on_nange) t='<span class="w">卡你这</span> · ';
  else if(p.status==='idea') t='点子 · ';
  else if(p.status==='paused') t='已暂停 · ';
  else if(p.status==='cancelled') t='已取消 · ';
  else if(p.status==='done') t='已完成 · ';
  var late=(p.status==='active'||p.status==='stalled')&&!p.blocked_on_nange&&n>=5;
  return '<i class="'+dotCls(p)+'"></i><span>'+t+(late?'<span class="m">'+n+'天没动</span>':ago(n)+'动过')+'</span>';
}
function hasAdv(id){return (DATA.log||[]).some(function(x){return x.project_id===id&&/^建议：/.test(x.text||'');});}
function card(p){
  var wh=p.what||p.stage||p.origin||'';
  return '<div class="c" draggable="true" data-id="'+p.id+'"><div class="nm">'+esc(p.name)+(hasAdv(p.id)?'<span style="color:var(--gold);font-size:12px"> ✦</span>':'')+'</div>'
    +(wh?'<div class="wh">'+esc(wh)+'</div>':'')+'<div class="ft">'+foot(p)+'</div></div>';
}
function row(p,kind,i){
  return '<div class="li" data-id="'+p.id+'">'+(kind==='n'?'<div class="n">'+i+'</div>':'<div class="dot"></div>')
    +'<div><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(kind==='n'?(p.next_step||p.stage):(p.ask||p.next_step))+'</div></div></div>';
}

function render(){
  var P=DATA.projects, live=P.filter(function(p){return !['done','paused','cancelled'].includes(p.status);});
  var ask=live.filter(function(p){return p.blocked_on_nange||p.ask;});
  var push=live.filter(function(p){return (p.status==='active'||p.status==='stalled')&&!p.blocked_on_nange;}).slice(0,3);
  var late=live.filter(function(p){return (p.status==='active'||p.status==='stalled')&&days(p.last_touched)>=5;}).length;
  document.getElementById('sum').innerHTML='<span class="st"><i></i>进行中<b>'+live.filter(function(p){return p.status==='active';}).length+'</b></span>'+'<span class="st"><i class="a"></i>停滞<b>'+late+'</b></span>'+'<span class="st"><i class="r"></i>等你<b>'+ask.length+'</b></span>'+'<span class="st"><i class="b"></i>点子<b>'+live.filter(function(p){return p.status==='idea';}).length+'</b></span>';
  var h='<div class="now"><div><div class="h">今日先推 <em>按优先级自动选，可在详情里加急</em></div><div class="list">'
    +(push.length?push.map(function(p,i){return row(p,'n',i+1);}).join(''):'<div class="none">暂时没有</div>')+'</div></div>'
    +'<div><div class="h">等你拍板 / 操作 <em>'+ask.length+' 件</em></div><div class="list">'
    +(ask.length?ask.map(function(p){return row(p,'d');}).join(''):'<div class="none">没有卡在你这的事</div>')+'</div></div></div>';
  h+=todoHtml();
  h+='<div class="h" style="margin-bottom:14px">全部项目 <em>点卡片看详情，电脑上可拖动排序</em></div><div class="cols">';
  GRPS.forEach(function(g){
    var items=live.filter(function(p){return p.grp===g;});
    if(!items.length&&g!=='点子池')return;
    h+='<div class="col'+(shut[g]?' shut':'')+'"><h2 onclick="shutg(\''+g+'\')">'+g+'<span>'+items.length+'</span></h2><div class="cards">'
      +(items.length?items.map(card).join(''):'<div class="empty">空的，上面随手记一个</div>')+'</div></div>';
  });
  h+='</div>';
  var rest=P.filter(function(p){return ['done','paused','cancelled'].includes(p.status);});
  if(rest.length) h+='<details class="fold"><summary>已完成 / 已暂停 / 已取消（'+rest.length+'）</summary><div class="cols">'+rest.map(card).join('')+'</div></details>';
  var y=window.scrollY; document.getElementById('m').innerHTML=h; window.scrollTo(0,y); bind();
}
function dueTxt(t){
  if(!t) return '';
  var d=new Date(t), n=new Date(), a=new Date(n.getFullYear(),n.getMonth(),n.getDate()), b=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var diff=Math.round((b-a)/864e5), hm=(d.getHours()||d.getMinutes())?(' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)):'';
  var c=diff<0?'late':diff===0?'today':'';
  var txt=diff<0?'过期'+(-diff)+'天':diff===0?'今天':diff===1?'明天':(d.getMonth()+1)+'月'+d.getDate()+'日';
  return '<span class="du '+c+'">'+txt+hm+'</span>';
}
function todoHtml(){
  var T=DATA.todos||[], open=T.filter(function(t){return !t.done;}), dn=T.filter(function(t){return t.done;});
  function r(t){return '<div class="td'+(t.done?' dn':'')+'"><button class="ck" onclick="tg('+t.id+','+(!t.done)+')" aria-label="完成">✓</button><div class="tt">'+esc(t.title)+(t.note?'<div style="font-size:12px;color:var(--dim)">'+esc(t.note)+'</div>':'')+'</div>'+dueTxt(t.due_at)+'<button class="rm" onclick="rmt('+t.id+')" aria-label="删除">×</button></div>';}
  var h='<div class="h">待办 <em>生活里的小事，和上面的项目任务分开；打勾就完成</em></div><div class="tds">'
    +(open.length?open.map(r).join(''):'<div class="none">没有待办。想到小事直接对上面说就行，比如“明天下班买电池”</div>')
    +(dn.length?dn.map(r).join(''):'')+'</div>';
  return h;
}
function tg(id,done){call({action:'todo_toggle',id:id,done:done}).then(function(){load(true);});}
function rmt(id){if(confirm('删掉这条待办？'))call({action:'todo_del',id:id}).then(function(){toast('已删除');load(true);});}
function feed(){
  var I=(DATA.inbox||[]).filter(function(x){return Date.now()-new Date(x.created_at).getTime()<36e5*6;}).slice(0,3).reverse();
  var h='';
  I.forEach(function(x){
    var pend=(x.status==='new'||x.status==='processing');
    var first=(x.reply||x.result||'').split('\n').filter(function(l){return l.trim();})[0]||'';
    h+='<div><b>你：</b>'+esc(x.content.length>80?x.content.slice(0,80)+'…':x.content)
      +(pend?'<div class="wait">⏳ 我正在分拣…</div>':'<div class="to">'+esc(first.replace(/\*\*/g,'')||'已处理')+'</div>')+'</div>';
  });
  document.getElementById('fb').innerHTML=h;
  return I.some(function(x){return x.status==='new'||x.status==='processing';});
}
function shutg(g){shut[g]=!shut[g];render();}

function blk(k,v,cls){return v?'<div class="blk '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>':'';}
function sheet(id){
  var p=byId(id); if(!p) return closeSheet();
  cur=id;
  var lg=DATA.log.filter(function(x){return x.project_id===id;}).sort(function(a,b){return new Date(a.at)-new Date(b.at);});
  var n=days(p.last_touched), h='';
  h+='<div class="sh-top"><h3>'+esc(p.name)+'</h3><button class="x" aria-label="关闭" onclick="closeSheet()">×</button></div>';
  h+='<div class="stl"><b>'+(p.blocked_on_nange?'卡在你这':ST[p.status]||p.status)+'</b> · 最后动过：'+ago(n)+'</div>';
  var adv=null; for(var i2=lg.length-1;i2>=0;i2--){if(/^建议：/.test(lg[i2].text||'')){adv=lg[i2];break;}}
  if(adv) h+='<div class="advbox"><div class="k">参谋建议 · '+fmt(adv.at)+'</div><div class="v">'+esc(adv.text.replace(/^建议：/,''))+'</div></div>';
  if(p.ask) h+='<div class="askbox"><div class="k">在等你</div><div class="v">'+esc(p.ask)+'</div><div class="acts" style="margin:0;padding:0;border:0"><button class="p" onclick="act('+p.id+',\'decide\',\'\',\'已记：你拍板了\')">我拍板了 / 做完了</button></div></div>';
  h+=blk('这是什么',p.what)+blk('为什么做',p.origin)+blk('现在到哪了',p.stage)+blk('下一步',p.next_step,'nx');
  if(lg.length){
    h+='<div class="blk"><div class="k">来龙去脉</div><div class="tl" style="margin-top:8px">'
      +lg.map(function(x,i){return '<div class="'+(i===lg.length-1?'last':'')+(x.who==='nange'?' me':'')+'"><small>'+fmt(x.at)+'</small>'+(x.who==='nange'?'你：':'')+esc(x.text)+'</div>';}).join('')+'</div></div>';
  }
  var rel=(p.related||[]).map(byId).filter(Boolean);
  var others=DATA.projects.filter(function(x){return x.id!==p.id&&(p.related||[]).indexOf(x.id)<0;});
  h+='<div class="blk"><div class="k">相关任务（双向链接）</div><div class="rel">'
    +rel.map(function(r){return '<a onclick="sheet('+r.id+')">'+esc(r.name)+'</a><a onclick="unlink('+p.id+','+r.id+')" style="color:var(--dim);border-color:var(--bd);padding:3px 7px" title="取消关联">×</a>';}).join('')
    +'<select id="lksel" onchange="linkTo('+p.id+',this.value)"><option value="">＋ 关联…</option>'+others.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>';}).join('')+'</select></div></div>';
  if(p.nange_note) h+='<div class="noted">你留的话：'+esc(p.nange_note)+'<a href="#" onclick="act('+p.id+',\'clear_note\',\'\',\'已清除\');return false">清除</a></div>';
  h+='<div class="acts">';
  if(p.status==='paused'||p.status==='done'||p.status==='idea'||p.status==='cancelled') h+='<button class="p" onclick="act('+p.id+',\'resume\',\'\',\'开始推进\')">'+(p.status==='idea'?'开干':'恢复')+'</button>';
  else h+='<button onclick="act('+p.id+',\'boost\',\'\',\'已加急\')">加急</button><button onclick="act('+p.id+',\'pause\',\'\',\'先停了\')">先停</button><button onclick="act('+p.id+',\'done\',\'\',\'标记完成\')">完成</button>';
  h+=(p.status==='cancelled'?'':'<button onclick="if(confirm(\'确定取消这条吗？\'))act('+p.id+',\'cancel\',\'\',\'已取消\')">取消</button>')+'<span class="sp"></span><button onclick="mv('+p.id+',-1)" aria-label="上移">↑</button><button onclick="mv('+p.id+',1)" aria-label="下移">↓</button></div>';
  h+='<div class="nt"><input id="ntx" placeholder="给我留一句话，我下次对话会看到" enterkeyhint="send"><button onclick="note()">留话</button></div>';
  var s=document.getElementById('sheet'), top=s.scrollTop; s.innerHTML=h; s.scrollTop=top;
  document.getElementById('ov').classList.add('on');
  document.getElementById('ntx').onkeydown=function(e){if(e.key==='Enter')note();};
}
function linkTo(id,to){if(!to)return;call({id:id,action:'link',to:+to}).then(function(){toast('已关联');load(true);});}
function unlink(id,to){call({id:id,action:'unlink',to:to}).then(function(){toast('已取消关联');load(true);});}
function closeSheet(){cur=null;document.getElementById('ov').classList.remove('on');}
function note(){var v=document.getElementById('ntx').value.trim();if(!v)return;act(cur,'note',v,'已留话');}
function mv(id,d){
  var p=byId(id);
  var ids=DATA.projects.filter(function(x){return x.grp===p.grp&&!['done','paused','cancelled'].includes(x.status);}).map(function(x){return x.id;});
  var i=ids.indexOf(id), j=i+d; if(i<0||j<0||j>=ids.length){toast(d<0?'已经在最前':'已经在最后');return;}
  ids.splice(j,0,ids.splice(i,1)[0]);
  call({action:'reorder',ids:ids}).then(function(){toast('顺序已调');load(true);});
}
function bind(){
  document.querySelectorAll('.li').forEach(function(el){el.onclick=function(){sheet(+el.dataset.id);};});
  document.querySelectorAll('.c').forEach(function(el){
    el.onclick=function(){sheet(+el.dataset.id);};
    el.ondragstart=function(e){el.classList.add('drag');e.dataTransfer.setData('text/plain',el.dataset.id);};
    el.ondragend=function(){el.classList.remove('drag');};
    el.ondragover=function(e){e.preventDefault();el.classList.add('over');};
    el.ondragleave=function(){el.classList.remove('over');};
    el.ondrop=function(e){
      e.preventDefault();el.classList.remove('over');
      var from=+e.dataTransfer.getData('text/plain'), to=+el.dataset.id; if(from===to)return;
      var pf=byId(from), pt=byId(to);
      if(pf.grp!==pt.grp){toast('只能在同一栏里排序');return;}
      var ids=DATA.projects.filter(function(x){return x.grp===pt.grp&&!['done','paused','cancelled'].includes(x.status);}).map(function(x){return x.id;});
      ids.splice(ids.indexOf(from),1); ids.splice(ids.indexOf(to),0,from);
      call({action:'reorder',ids:ids}).then(function(){load(true);});
    };
  });
}
document.getElementById('ov').onclick=function(e){if(e.target.id==='ov')closeSheet();};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

function busy(){var a=document.activeElement;return a&&a.tagName==='INPUT'&&a.value;}
function load(force){
  if(!force&&busy())return;
  fetch(API+'?board=1&k='+encodeURIComponent(K)).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    DATA.inbox=d.inbox; DATA.todos=d.todos; var pend=feed();
    var s=JSON.stringify(d.projects.map(function(p){return [p.id,p.status,p.priority,p.last_touched,p.stage,p.next_step,p.ask,p.nange_note,p.what,(p.related||[]).join('.')];}))+d.log.length+JSON.stringify(d.todos.map(function(t){return [t.id,t.done,t.title,t.due_at];}));
    clearTimeout(window._pt); if(pend) window._pt=setTimeout(function(){load(true);},4000);
    if(!force&&s===sig)return; sig=s; DATA=d; render(); if(cur) sheet(cur);
  }).catch(function(){document.getElementById('m').innerHTML='<div class="empty">连不上，检查链接里的 k</div>';});
}
var sayEl=document.getElementById('say'), hint=document.getElementById('hint');
function grow(){sayEl.style.height='auto';sayEl.style.height=Math.min(sayEl.scrollHeight,Math.round(window.innerHeight*0.38))+'px';sayEl.scrollTop=sayEl.scrollHeight;}
sayEl.addEventListener('input',function(){grow();});
var pics=[];
function drawChips(){document.getElementById('chips').innerHTML=pics.map(function(p,i){return '<div class="chip"><img src="'+p.url+'"><b onclick="rmpic('+i+')">×</b></div>';}).join('');}
function rmpic(i){URL.revokeObjectURL(pics[i].url);pics.splice(i,1);drawChips();}
function shrink(file){return new Promise(function(ok){
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){var m=1800,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){ok(b||file);},'image/jpeg',0.86);};
  img.onerror=function(){URL.revokeObjectURL(u);ok(file);}; img.src=u;});}
document.getElementById('pic').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(){
  Array.prototype.forEach.call(this.files,function(f){shrink(f).then(function(b){pics.push({blob:b,url:URL.createObjectURL(b)});drawChips();});});
  this.value='';
};
sayEl.addEventListener('paste',function(e){
  var items=(e.clipboardData||{}).items||[];
  for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){var f=items[i].getAsFile();shrink(f).then(function(b){pics.push({blob:b,url:URL.createObjectURL(b)});drawChips();});e.preventDefault();}}
});
document.getElementById('lnk').onclick=function(){
  var ins=function(t){if(!t)return;sayEl.value+=(sayEl.value&&!/\s$/.test(sayEl.value)?' ':'')+t;grow();sayEl.focus();};
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){if(/https?:\/\//.test(t))ins(t);else{toast('剪贴板里没有链接，长按输入框粘贴');sayEl.focus();}}).catch(function(){toast('长按输入框粘贴链接');sayEl.focus();});}
  else{toast('长按输入框粘贴链接');sayEl.focus();}
};
function send(){
  var v=sayEl.value.trim(); if(!v&&!pics.length)return;
  var jobs=[], base=API.replace('tianshu-app','');
  if(pics.length){
    pics.forEach(function(p,i){
      jobs.push(fetch(base+'ts-image?src=board&k='+encodeURIComponent(K)+'&note='+encodeURIComponent(i===0?v:''),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:p.blob}).then(function(r){if(!r.ok)throw 0;}));
    });
  } else {
    jobs.push(fetch(API+'?send=1&src=board&k='+encodeURIComponent(K),{method:'POST',body:v}).then(function(r){if(!r.ok)throw 0;}));
  }
  Promise.all(jobs).then(function(){sayEl.value='';grow();pics.forEach(function(p){URL.revokeObjectURL(p.url);});pics=[];drawChips();toast('收到，我来分');load(true);}).catch(function(){toast('没发出去，再试一下');});
}
document.getElementById('go').onclick=send;
sayEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send();}});
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, micOn=false;
document.getElementById('mic').onclick=function(){
  var b=this, lb=document.getElementById('miclb');
  if(!SR){toast('这个浏览器不支持一键语音，点输入框用键盘上的话筒');sayEl.focus();return;}
  if(micOn){rec&&rec.stop();return;}
  rec=new SR(); rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=true;
  var base=sayEl.value?sayEl.value+' ':'';
  rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;sayEl.value=base+t;grow();sayEl.setSelectionRange(sayEl.value.length,sayEl.value.length);};
  rec.onerror=function(e){toast(e.error==='not-allowed'?'没有麦克风权限，到浏览器设置里允许':'语音没识别到，再说一次');};
  rec.onstart=function(){micOn=true;b.classList.add('on');lb.textContent='说完点我';hint.textContent='在听…说完再点一下，自动发送';};
  rec.onend=function(){micOn=false;b.classList.remove('on');lb.textContent='网页语音';hint.textContent='中英混着说：点输入框，用豆包输入法键盘上的话筒更准';if(sayEl.value.trim())send();};
  rec.start();
};
load(true); setInterval(load,20000);
</script></body></html>
